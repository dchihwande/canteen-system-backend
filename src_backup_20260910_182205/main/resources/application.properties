spring.application.name=canteen-system-backend

# Disable Liquibase (you're not using it)
spring.liquibase.enabled=false

# H2 for now (in-memory dev DB)
spring.datasource.url=jdbc:h2:mem:canteendb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable LDAP auto-config until we set up real LDAP
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration