spring.application.name=canteen-system-backend

# ---------- Server ----------
server.port=8080

# ---------- H2 (dev) ----------
spring.datasource.url=${DB_URL:jdbc:h2:mem:canteendb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- H2 console ----------
spring.h2.console.enabled=true

# ---------- Liquibase ----------
spring.liquibase.enabled=false

# ---------- Active Directory ----------
ad.domain=${AD_DOMAIN:bancabc.co.zw}
ad.url=${AD_URL:ldap://10.0.0.5:389}
ad.user-dn-pattern=${AD_USER_DN_PATTERN:{0}@bancabc.co.zw}
ad.root-dn=${AD_ROOT_DN:DC=bancabc,DC=co,DC=zw}

# ---------- Local cashier seed ----------
cashier.username=${CASHIER_USERNAME:cashier}
cashier.password=${CASHIER_PASSWORD:ChangeMe123!}
cashier.email=${CASHIER_EMAIL:cashier@bancabc.co.zw}

# ---------- JWT ----------
security.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZC0xMjM0NTY3OA==}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Mail ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Health checks (disable slow external probes) ----------
management.health.ldap.enabled=false
management.health.mail.enabled=false

# ---------- Canteen pricing ----------
canteen.lunch.traditional-price=2.50
canteen.lunch.western-price=3.50
canteen.drink.default-price=1.00

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.org.springframework.ldap=INFO
logging.level.co.zw.bancabc.canteen_system_backend=INFO